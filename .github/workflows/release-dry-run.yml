name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - releasebox.config.json
      - package.json
      - package-lock.json
      - scripts/package-smoke.mjs
      - .github/workflows/release*.yml
      - docs/RELEASE_CHECKLIST.md

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local release gate
        run: npm run release:check

      - name: Generate release notes preview
        run: |
          echo "## Release candidate" > release-notes-preview.md
          echo >> release-notes-preview.md
          git log --oneline --max-count=20 >> release-notes-preview.md
          echo >> release-notes-preview.md
          cat docs/RELEASE_CHECKLIST.md >> release-notes-preview.md
          cat release-notes-preview.md

      - name: Upload release notes preview
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-preview
          path: release-notes-preview.md
